<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" fill="none">
 <defs>
  <linearGradient id="lilyPetal" x1="0" y1="-100" x2="0" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#fffaf7"/><stop offset=".42" stop-color="#ffe8eb"/><stop offset=".76" stop-color="#f4b8c8"/><stop offset="1" stop-color="#d783a1"/></linearGradient>
  <linearGradient id="lilyInner" x1="0" y1="-80" x2="0" y2="25" gradientUnits="userSpaceOnUse"><stop stop-color="#fffdfa"/><stop offset=".64" stop-color="#fae8e9"/><stop offset="1" stop-color="#e5a9bd"/></linearGradient>
  <linearGradient id="lilyStem" x1="0" y1="0" x2="22" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#537b59"/><stop offset=".5" stop-color="#89a96f"/><stop offset="1" stop-color="#476e52"/></linearGradient>
  <g id="stargazer" stroke="#bc758c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <!-- Six separate, broad tepals curl back from the trumpet. Rounded tips and overlapping bases keep the flower from reading as a flat star. -->
   <path d="M-5 18C-23 9-53-10-70-37-85-61-82-86-61-96-44-104-25-91-16-69-7-48-4-17-5 18Z" fill="url(#lilyPetal)"/>
   <path d="M-3 16C-9-6-18-42-13-70-8-98 7-113 25-105 44-97 46-73 36-48 27-23 11 3-3 16Z" fill="url(#lilyInner)"/>
   <path d="M0 15C9-5 22-37 42-59 61-81 83-86 96-70 109-53 97-30 77-11 57 8 25 20 0 15Z" fill="url(#lilyPetal)"/>
   <path d="M3 15C25 5 58-9 84-8 111-7 127 8 119 27 111 47 85 51 60 42 36 34 12 23 3 15Z" fill="url(#lilyInner)"/>
   <path d="M1 17C19 35 42 62 47 89 52 115 41 134 21 132 1 131-10 108-9 81-8 54-2 28 1 17Z" fill="url(#lilyPetal)"/>
   <path d="M-5 18C-20 37-43 61-69 72-94 82-115 74-116 53-117 32-96 17-69 13-43 9-16 12-5 18Z" fill="url(#lilyInner)"/>
   <!-- Fine central veins follow the curl of each petal. -->
   <g fill="none" stroke="#d994a9" stroke-width="1.7" opacity=".75"><path d="M0 12C-18-21-47-64-69-78"/><path d="M0 12C-5-28-3-78 10-94"/><path d="M0 12C18-19 52-54 79-62"/><path d="M3 16C39 3 80 7 103 17"/><path d="M0 18C14 55 31 91 30 117"/><path d="M-3 18C-38 17-76 35-101 51"/></g>
   <!-- Shallow cup and throat. -->
   <path d="M-17-10C-15-31-3-42 3-43 13-35 18-22 16-7 13 10 7 21 0 25-9 20-16 7-17-10Z" fill="#f2b5c4" stroke="#ca8097" stroke-width="1.8"/>
   <path d="M-8 9C-5-5-2-18 2-31m0 16c-7-9-11-14-15-17m16 17c6-9 10-14 15-16m-15 6c-7-6-10-9-12-12m12 12c6-7 10-10 13-12" fill="none" stroke="#d69b52" stroke-width="2.3"/>
   <g fill="#d39a48" stroke="#bd8040" stroke-width="1.2"><ellipse cx="-13" cy="-27" rx="4.8" ry="2.5" transform="rotate(25 -13 -27)"/><ellipse cx="18" cy="-27" rx="4.8" ry="2.5" transform="rotate(-25 18 -27)"/><ellipse cx="-10" cy="-17" rx="4.4" ry="2.4"/><ellipse cx="14" cy="-17" rx="4.4" ry="2.4"/><ellipse cx="3" cy="-12" rx="4.7" ry="2.5" transform="rotate(-8 3 -12)"/></g>
   <g fill="#b75f7d" stroke="none" opacity=".7"><circle cx="-24" cy="-19" r="2"/><circle cx="-31" cy="-31" r="1.7"/><circle cx="-18" cy="-39" r="1.7"/><circle cx="27" cy="-17" r="2"/><circle cx="34" cy="-28" r="1.7"/><circle cx="22" cy="-37" r="1.7"/><circle cx="-1" cy="-52" r="1.5"/></g>
  </g>
  <g id="lilyBud" stroke="#668764" stroke-width="2.4" stroke-linejoin="round"><path d="M0 1c-9-31-5-60 11-83 22 17 28 45 14 80C16 9 8 10 0 1Z" fill="#9caf78"/><path d="M11-77c2 27 3 51 2 78m1-24c-9-13-13-26-12-39m13 28c8-12 12-24 11-36" stroke="#d4d4a0" stroke-width="1.8"/></g>
  <g id="lilyLeaf" stroke="#71916a" stroke-width="2" stroke-linejoin="round"><path d="M0 0C-8-35 5-69 55-93 66-47 43-12 0 0Z" fill="#718f68"/><path d="M0 0 51-86M4-8 35-68M10-18 60-49" stroke="#bdd09b" stroke-width="1.5"/></g>
 </defs>
 <g opacity=".94" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main flowering stems -->
  <path d="M528 900c-4-156-20-300-74-456m77 456c8-148 43-270 121-397M282 902c5-151-10-275-65-421m68 421c-4-126 24-232 83-326M88 899c16-121 31-214 81-309" stroke="url(#lilyStem)" stroke-width="8"/>
  <path d="M454 521c-52-49-111-62-173-39m223-12c49-59 107-81 174-69M214 481c-49-48-95-61-144-47m264 110c35-48 81-68 136-60" stroke="#6e936a" stroke-width="5"/>
  <!-- Alternating lance-shaped leaves -->
  <g><use href="#lilyLeaf" transform="translate(450 663) rotate(-28) scale(1.18)"/><use href="#lilyLeaf" transform="translate(551 731) rotate(148) scale(.98)"/><use href="#lilyLeaf" transform="translate(475 809) rotate(-25) scale(.88)"/><use href="#lilyLeaf" transform="translate(585 594) rotate(152) scale(.77)"/>
   <use href="#lilyLeaf" transform="translate(293 674) rotate(-25) scale(1.04)"/><use href="#lilyLeaf" transform="translate(365 733) rotate(150) scale(.82)"/><use href="#lilyLeaf" transform="translate(319 835) rotate(-24) scale(.92)"/><use href="#lilyLeaf" transform="translate(174 662) rotate(150) scale(.86)"/>
   <use href="#lilyLeaf" transform="translate(98 700) rotate(-24) scale(.8)"/><use href="#lilyLeaf" transform="translate(159 760) rotate(150) scale(.72)"/>
  </g>
  <!-- Open lily blossoms, turned slightly in different directions -->
  <use href="#stargazer" transform="translate(450 424) rotate(-18) scale(1.26)"/>
  <use href="#stargazer" transform="translate(641 437) rotate(31) scale(.93)"/>
  <use href="#stargazer" transform="translate(216 466) rotate(-27) scale(.98)"/>
  <use href="#stargazer" transform="translate(380 581) rotate(19) scale(.74)"/>
  <use href="#stargazer" transform="translate(147 589) rotate(-14) scale(.62)"/>
  <!-- Unopened lily buds -->
  <use href="#lilyBud" transform="translate(390 473) rotate(-24) scale(.78)"/>
  <use href="#lilyBud" transform="translate(571 514) rotate(20) scale(.7)"/>
  <use href="#lilyBud" transform="translate(257 543) rotate(-29) scale(.66)"/>
  <path d="M68 831c73-21 145-22 215-3m152 41c92-25 174-23 248 8" stroke="#8eb1af" stroke-width="2.3" opacity=".42"/>
 </g>
</svg>
